<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VinSchool Quiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="min-h-screen font-sans flex items-center justify-center bg-gradient-to-br from-blue-50 via-slate-50 to-emerald-50">

  <div class="fixed inset-0 bg-black/10 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-8 space-y-7">

      <div class="text-center space-y-1.5">
        <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
          <i class="fa-solid fa-graduation-cap text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800">VinSchool Quiz</h1>
        <p class="text-slate-400 text-sm">Chọn môn học để bắt đầu</p>
      </div>

      <div class="space-y-3">
        <a href="./math/"
          class="flex items-center gap-4 p-4 rounded-xl border-2 border-slate-200 hover:border-blue-400 hover:bg-blue-50 transition-all group cursor-pointer no-underline">
          <div class="w-11 h-11 rounded-xl bg-blue-100 flex items-center justify-center text-blue-600 text-lg flex-shrink-0 group-hover:bg-blue-200 transition-colors">
            <i class="fa-solid fa-square-root-variable"></i>
          </div>
          <div class="flex-1">
            <p class="font-semibold text-slate-800">Toán</p>
            <p class="text-xs text-slate-400">Dãy số, sắp xếp, ...</p>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-blue-400 transition-colors"></i>
        </a>

        <a href="./english/"
          class="flex items-center gap-4 p-4 rounded-xl border-2 border-slate-200 hover:border-emerald-400 hover:bg-emerald-50 transition-all group cursor-pointer no-underline">
          <div class="w-11 h-11 rounded-xl bg-emerald-100 flex items-center justify-center text-emerald-600 text-lg flex-shrink-0 group-hover:bg-emerald-200 transition-colors">
            <i class="fa-solid fa-book-open"></i>
          </div>
          <div class="flex-1">
            <p class="font-semibold text-slate-800">English</p>
            <p class="text-xs text-slate-400">Từ vựng, ngữ pháp, ...</p>
          </div>
          <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-emerald-400 transition-colors"></i>
        </a>
      </div>

    </div>
  </div>

</body>
</html>
